name: Email migration tests

on:
  pull_request:
    paths:
      - ".github/workflows/test-email-migrations.yml"
      - "shura-backend/migrations/**"
      - "shura-backend/production_schema.sql"
      - "shura-backend/test/emailMigration.test.js"
      - "shura-backend/package.json"
      - "shura-backend/package-lock.json"

jobs:
  email-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shura_migration_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shura_migration_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: shura-backend
    env:
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shura_migration_tests
      E2E_DATABASE_SAFE_TO_MUTATE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: shura-backend/package-lock.json
      - run: npm ci
      # Fresh-bootstrap coverage creates and drops an isolated database so
      # legacy migrations cannot see similarly named tables in another schema.
      - run: npm run test:email-migrations
